# DeCypherTek.ai — Android APK build (manual dispatch).
#
# ONE workflow for the whole Android app, engine included:
#
#   * The QEMU VM engine (libqemu.so + EDK2 firmware) is behind an
#     actions/cache keyed on the QEMU version + NDK version + build
#     script hash. Same version -> the cached engine is restored in
#     seconds and nothing rebuilds. Bump `qemu_version` (input, or the
#     default below) -> key changes -> the composite action
#     (.github/actions/build-qemu-engine) builds the new engine once
#     and re-caches it. `rebuild_engine: true` forces a fresh build in
#     this run for debugging (the cache only rolls over via a version
#     bump or script change — that is the "new version" trigger).
#
#   * The Flutter + Rust app itself builds every dispatch, after a
#     guard step proving the repo-root terminal AI still compiles and
#     passes its tests unchanged (it is not built for Android here —
#     the repo-root crate keeps building for regular Linux through its
#     own Prod-Build / dev pipelines).
#
# Every dispatch RE-PUBLISHES the single rolling `android-latest`
# prerelease (same tag, fresh APK), like the dev channels do.

name: Android-Build

on:
  workflow_dispatch:
    inputs:
      qemu_version:
        description: "QEMU engine version (bump = rebuild the engine, same = reuse the cache)"
        required: false
        default: "9.2.0"
      rebuild_engine:
        description: "Force a fresh engine build this run (debugging; cache rolls over only on version/script change)"
        type: boolean
        required: false
        default: false
      tag:
        description: "APK release tag (empty = android-latest)"
        required: false
        default: ""
      notes:
        description: "Release notes"
        required: false
        default: "New DeCypherTek.ai Android build — the headless Mobian VM app (terminal view, no VNC, loopback-only SSH)."

concurrency:
  group: Android-Build
  cancel-in-progress: false

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  guard-and-test:
    name: root crate unchanged + android core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The terminal AI itself: must keep building for regular Linux,
      # byte for byte the same pipeline as before the android/ app.
      - name: Root crate (the terminal AI) still green
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      # The new Android core: same gates.
      - name: Android core gates
        working-directory: android/core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build-apk:
    name: build APK (arm64)
    needs: guard-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }} platforms;android-35 build-tools;35.0.0"

      - name: Pin the NDK (never guess — runner images ship their own)
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK" || { echo "::error::NDK $NDK_VERSION missing"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install Rust + cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ---- The VM engine: cache first, build only on change ----
      - name: Compute engine cache key
        id: engine_key
        run: |
          SCRIPT_HASH="$(sha256sum android/scripts/build-qemu-android.sh | cut -c1-12)"
          echo "key=qemu-aarch64-${{ inputs.qemu_version }}-ndk-${NDK_VERSION}-v1-${SCRIPT_HASH}" >> "$GITHUB_OUTPUT"
          echo "qemu=${{ inputs.qemu_version }}" >> "$GITHUB_OUTPUT"

      - name: Restore the QEMU engine (same version = same engine)
        id: engine_cache
        uses: actions/cache@v4
        with:
          path: engine
          key: ${{ steps.engine_key.outputs.key }}

      - name: Build the QEMU engine (only on version bump / miss / force)
        if: steps.engine_cache.outputs.cache-hit != 'true' || inputs.rebuild_engine
        uses: ./.github/actions/build-qemu-engine
        with:
          qemu-version: ${{ inputs.qemu_version }}
          ndk-version: ${{ env.NDK_VERSION }}
          api: "28"
          out: engine

      - name: Engine present?
        run: |
          test -f engine/libqemu-arm64-v8a.so \
            || { echo "::error::engine artifacts missing"; exit 1; }
          ls -lh engine/

      # ---- The APK ----
      - name: Build the APK
        run: |
          bash android/scripts/build-android.sh \
            --engine-dir engine \
            --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: decyphertek-android
          path: dist/
          if-no-files-found: error

      - name: Publish rolling APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          [[ -n "$TAG" ]] || TAG="android-latest"
          NOTES="$(cat <<'EOF'
          ${{ inputs.notes }}
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* \
            --title "DeCypherTek.ai Android $TAG" \
            --notes "$NOTES" \
            --prerelease
