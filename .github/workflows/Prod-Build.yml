# DeCypherTek.ai — Prod-Build pipeline.
#
# Manual dispatch: Actions → Prod-Build → Run workflow. Builds the single
# Rust static binary for every target, packages per-target tar.gz assets
# with SHA-256 checksums, and publishes a GitHub Release. The install
# script pulls `releases/latest`, so every dispatch is instantly the
# version a phone or PC installs — and re-running the installer updates.
#
# Production keeps exactly ONE release: every dispatch RE-PUBLISHES it
# (same tag, fresh date, fresh notes, new assets), so the releases page
# always shows the new prod build — not a stale "released days ago"
# entry with silently swapped assets. Superseded stable tags (from
# before a version bump) are swept away — `releases/latest` always
# serves the fresh build. Prereleases (the dev channels') are never
# touched from here, so this pipeline can never create a dev
# pre-release, and Prod only ever ships `v<version>`.
#
# Targets:
#   aarch64-unknown-linux-musl  -> Termux on Android (64-bit) + ARM Linux
#   armv7-unknown-linux-musleabihf -> older 32-bit Android phones
#   x86_64-unknown-linux-musl   -> PCs, servers (pc/)
#   aarch64/x86_64-apple-darwin -> macOS

name: Prod-Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = v<version from Cargo.toml>)"
        required: false
        default: ""
      notes:
        description: "Release notes (shown on the release page)"
        required: false
        default: "New release of DeCypherTek.ai — run the install command to get it: curl -fsSL https://github.com/decyphertek-io/DeCypherTek.ai/raw/main/scripts/install.sh | bash"

concurrency:
  group: Prod-Build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build (static musl)
        run: cross build --release --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: |
          chmod +x target/${{ matrix.target }}/release/decyphertek
          if [[ "${{ matrix.target }}" == x86_64-* ]]; then
            target/${{ matrix.target }}/release/decyphertek --version
            target/${{ matrix.target }}/release/decyphertek --help
          else
            echo "host-runnable smoke test skipped for ${{ matrix.target }} (cross-arch)"
          fi

      - name: Package
        run: |
          mkdir -p pkg dist
          cp target/${{ matrix.target }}/release/decyphertek pkg/decyphertek
          cp LICENSE pkg/
          tar -czf dist/decyphertek-${{ matrix.target }}.tar.gz -C pkg decyphertek LICENSE
          ( cd dist && sha256sum decyphertek-${{ matrix.target }}.tar.gz > decyphertek-${{ matrix.target }}.tar.gz.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  build-macos:
    name: build ${{ matrix.target }}
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: |
          target/${{ matrix.target }}/release/decyphertek --version
          target/${{ matrix.target }}/release/decyphertek --help

      - name: Package
        run: |
          mkdir -p pkg dist
          cp target/${{ matrix.target }}/release/decyphertek pkg/decyphertek
          cp LICENSE pkg/
          tar -czf dist/decyphertek-${{ matrix.target }}.tar.gz -C pkg decyphertek LICENSE
          ( cd dist && shasum -a 256 decyphertek-${{ matrix.target }}.tar.gz > decyphertek-${{ matrix.target }}.tar.gz.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Gather artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Merge checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -la
          cat checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES="$(cat <<'EOF'
          ${{ github.event.inputs.notes }}
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing it with this fresh build (same tag, new date + notes)."
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* \
            --title "DeCypherTek.ai $TAG (Prod)" \
            --notes "$NOTES" \
            --latest
          echo "$TAG re-published as the single production release."

          # One production release at a time: `releases/latest` always
          # serves the fresh build, so a superseded stable tag (left by
          # a version bump) is swept here. Prereleases — the dev
          # channels' — are never touched from this workflow.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' \
            | while read -r OLD; do
                if [[ "$OLD" == "$TAG" ]]; then continue; fi
                PRE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$OLD" --jq '.prerelease')"
                if [[ "$PRE" == "true" ]]; then continue; fi
                echo "Removing superseded stable release: $OLD"
                gh release delete "$OLD" --yes --cleanup-tag \
                  || echo "could not delete $OLD (continuing)"
              done
