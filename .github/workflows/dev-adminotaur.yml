# DeCypherTek.ai — dev-adminotaur pipeline (dev/testing channel).
#
# Runs on every push to the `dev-adminotaur` branch: unit tests (fmt +
# clippy + cargo test) plus the same cross-compilation matrix as the
# Prod-Build workflow, then publishes the packaged assets as a GitHub
# PRERELEASE tagged `v<version>-dev.<short-sha>`. Prereleases are
# excluded from `releases/latest`, so the install script keeps serving
# the stable Prod-Build output — dev builds only reach devices that
# download them explicitly from the prerelease page.

name: dev-adminotaur

on:
  push:
    branches: [dev-adminotaur]
  workflow_dispatch:

concurrency:
  group: dev-adminotaur
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: fmt + clippy + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: unit tests
        run: cargo test

  build-linux:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build (static musl)
        run: cross build --release --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: |
          chmod +x target/${{ matrix.target }}/release/decyphertek
          if [[ "${{ matrix.target }}" == x86_64-* ]]; then
            target/${{ matrix.target }}/release/decyphertek --version
            target/${{ matrix.target }}/release/decyphertek --help
          else
            echo "host-runnable smoke test skipped for ${{ matrix.target }} (cross-arch)"
          fi

      - name: Package
        run: |
          mkdir -p pkg dist
          cp target/${{ matrix.target }}/release/decyphertek pkg/decyphertek
          cp LICENSE pkg/
          tar -czf dist/decyphertek-${{ matrix.target }}.tar.gz -C pkg decyphertek LICENSE
          ( cd dist && sha256sum decyphertek-${{ matrix.target }}.tar.gz > decyphertek-${{ matrix.target }}.tar.gz.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  build-macos:
    name: build ${{ matrix.target }}
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: |
          target/${{ matrix.target }}/release/decyphertek --version
          target/${{ matrix.target }}/release/decyphertek --help

      - name: Package
        run: |
          mkdir -p pkg dist
          cp target/${{ matrix.target }}/release/decyphertek pkg/decyphertek
          cp LICENSE pkg/
          tar -czf dist/decyphertek-${{ matrix.target }}.tar.gz -C pkg decyphertek LICENSE
          ( cd dist && shasum -a 256 decyphertek-${{ matrix.target }}.tar.gz > decyphertek-${{ matrix.target }}.tar.gz.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish dev prerelease
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          SHORT="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "tag=v${VER}-dev.${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Gather artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          merge-multiple: true
          path: dist/

      - name: Merge checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -la
          cat checksums.txt

      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY="$(printf '%s' "$HEAD_MSG" | head -n1)"
          if [[ -z "$SUMMARY" ]]; then
            SUMMARY="manual run of the dev-adminotaur workflow"
          fi
          NOTES="Dev build from the dev-adminotaur branch - prerelease for testing, excluded from releases/latest, so the standard install script keeps serving the stable release.
          
          Commit: ${GITHUB_SHA}
          ${SUMMARY}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating assets (--clobber)."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "DeCypherTek.ai $TAG (dev)" \
              --notes "$NOTES" \
              --prerelease
          fi
